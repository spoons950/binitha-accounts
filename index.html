<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BINITHA KUNNAMKULAM</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#150A38;--surface:#241552;--ink:#EEE9FF;--muted:#AA9CD9;--line:#3B2879;--leaf:#8E6BFF;--leaf-ink:var(--bi);--bi:#FFFFFF;--g1:#6A4BF2;--g2:#9A78FF;--glow:#4A2BB8;--turmeric:#A9C0FF;--chili:#FF8FA8;--soft:#2C1A6B;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 55% at 85% 0%,var(--glow) 0%,transparent 65%),radial-gradient(90% 40% at 0% 100%,color-mix(in srgb,var(--g1) 55%,transparent) 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Anek Malayalam","Noto Sans Malayalam",system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:620px;margin:0 auto;padding:20px 16px 90px;position:relative;z-index:1}
h1{font-size:30px;font-weight:800;margin:6px 0 0;line-height:1.25}
.date{color:var(--muted);margin:0 0 18px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:6px;background:var(--soft);padding:5px;border-radius:14px;margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:9px 4px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
form{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
.row{display:flex;gap:8px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.add{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--leaf-ink);font:inherit;font-weight:600;padding:11px;border-radius:10px;cursor:pointer}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:15px}
.late{color:var(--chili);font-weight:600}
.chk{width:26px;height:26px;margin-top:3px;accent-color:var(--leaf);flex:none}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}
.stars{color:var(--turmeric);letter-spacing:2px}
.due{background:var(--soft);border-left:5px solid var(--turmeric);border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.due b{flex:1}
.mini{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--leaf-ink);font:inherit;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2))}
.bar i.over{background:var(--chili)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
h2{font-size:19px;margin:22px 0 10px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.share{display:block;width:100%;margin:0 0 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;padding:10px;border-radius:12px;cursor:pointer}
.share[hidden]{display:none}
.share:disabled{opacity:.6}
#musicbox{margin-bottom:14px}

.wxcard{position:relative;margin:-2px 0 18px;padding:16px 18px;border-radius:20px;color:#fff;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,var(--wa,#5B3FD6),var(--wb,#2A1A63));box-shadow:0 0 30px var(--wg,rgba(140,110,255,.5)),0 6px 20px rgba(0,0,0,.35);min-height:60px}
.wxcard::before{content:"";position:absolute;inset:-60%;z-index:0;background:conic-gradient(from 0deg,transparent 0%,rgba(255,255,255,.55) 12%,transparent 30%);animation:wxspin 7s linear infinite}
.wxcard::after{content:"";position:absolute;inset:2px;z-index:1;border-radius:18px;background:linear-gradient(135deg,var(--wa,#5B3FD6),var(--wb,#2A1A63))}
.wxcard>*{position:relative;z-index:2}
@keyframes wxspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wxcard::before{animation:none}}
.wxp{font-size:14px;opacity:.92;font-weight:600}
.wxm{display:flex;align-items:baseline;gap:10px;margin:4px 0}
.wxe{font-size:34px}
.wxt{font-size:46px;font-weight:800;line-height:1}
.wxd{font-size:17px;font-weight:600}
.wxs{font-size:14px;opacity:.92}
.wxline{margin:-8px 0 16px;font-weight:600;color:var(--ink);cursor:pointer;min-height:1.2em}
nav button{font-size:14.5px;padding:9px 12px;flex:none;white-space:nowrap}
.week{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.wd{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.wb{height:80px;background:var(--soft);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}
.wb i{display:block;width:100%;background:var(--g2);opacity:.55}
.wb i.ok{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:7px 12px;border-radius:20px;cursor:pointer}
.ans{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--turmeric);border-radius:14px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}

h1{font-size:25px;letter-spacing:.04em;margin-bottom:0}
.sub{margin:2px 0 4px;color:var(--muted);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.sc span{display:block;font-size:13px;color:var(--muted)}
.sc b{display:block;font-size:17px}
.pos{color:#5fd38d}.neg{color:#ff8f8f}

function onField(e){

else if(i==='g_disc'){G.disc=t.value}
else if(i==='g_cost'){G.cost=t.value}
gstCalc();return}
